id: net.redeclipse.RedEclipse
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: redeclipse
finish-args:
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --persist=.redeclipse
modules:

  - name: SDL2_image
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DSDL2IMAGE_DEPS_SHARED=OFF
      - -DSDL2IMAGE_STRICT=ON
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.12/SDL2_image-2.8.12.tar.gz
        sha256: 393f5efb50536ec13ca4f4affb69cc9966d3c3f969e6c5e701faddf9f9785381

  - name: redeclipse
    no-autogen: true
    build-options:
      cflags: -O3 -fomit-frame-pointer
      cflags-override: true
      cxxflags: -O3 -fomit-frame-pointer -ffast-math -fno-finite-math-only
      cxxflags-override: true
    subdir: src
    sources:
      - type: git
        url: https://github.com/redeclipse/base.git
        commit: faf378d12558addc700d0e464e7e8c3a39fbceee
      - type: file
        path: net.redeclipse.RedEclipse.metainfo.xml
      - type: file
        path: redeclipse.sh
      - type: file
        path: redeclipse_server.sh
      - type: file
        path: genkey.sh
      - type: patch
        path: gcc16.patch # Can probably be removed with 2.1.0, check if the upstream fix was merged
    post-install:
      - install -Dm755 ../redeclipse.sh /app/bin/redeclipse
      - install -Dm755 ../redeclipse_server.sh /app/bin/redeclipse_server
      - install -Dm755 ../genkey.sh /app/bin/genkey
      - install -Dm755 ../bin/amd64/redeclipse_linux /app/share/redeclipse/redeclipse
      - install -Dm755 ../bin/amd64/redeclipse_server_linux /app/share/redeclipse/redeclipse_server
      - install -Dm755 ../bin/amd64/genkey_linux /app/share/redeclipse/genkey
      - cp -a ../config ../data /app/share/redeclipse
      - install -Dm644 ../net.redeclipse.RedEclipse.metainfo.xml /app/share/metainfo/net.redeclipse.RedEclipse.metainfo.xml
      - install -Dm644 ../src/install/nix/redeclipse.desktop.am /app/share/applications/net.redeclipse.RedEclipse.desktop
      - install -Dm644 ../src/install/nix/redeclipse_x128.png /app/share/icons/hicolor/128x128/apps/net.redeclipse.RedEclipse.png
      - desktop-file-edit --set-icon=net.redeclipse.RedEclipse --set-key=Exec --set-value=redeclipse /app/share/applications/net.redeclipse.RedEclipse.desktop
